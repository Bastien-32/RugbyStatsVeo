# Trois services : la base, l'API, le front.
#
#   docker compose up --build
#
# La base garde ses donnees dans un volume nomme : arreter
# les conteneurs ne les efface pas.

name: rugbystats

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      # L'API ne demarre pas avant que la base reponde.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${DB_PORT:-5434}:5432"

  # Les migrations tournent une fois, puis le conteneur s'arrete.
  migrations:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      BASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      ECOUTE: ":8080"
    ports:
      - "${API_PORT}:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"

volumes:
  donnees:
