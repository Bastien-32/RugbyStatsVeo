server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Une application a une seule page : toute route inconnue
    # rend index.html, et le routeur du navigateur prend le
    # relais.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API derriere le meme nom de domaine : pas de CORS, pas
    # d'adresse a configurer dans le front.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
